<ion-header>
  <ion-toolbar>
    <!-- Ícone à Direita -->
    <ion-button slot="end">
      <img class="bigode-icon" src="assets/icon/bigode-icon.png" alt="bigode-icon">
    </ion-button>

    <!-- Título centralizado -->
    <ion-title>
      <ng-content select="[titulo]"></ng-content>
    </ion-title>

    <!-- Botao opcional à esquerda -->
    <ion-buttons slot="start" >
      <ng-content select="[icon-botao]"></ng-content>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
