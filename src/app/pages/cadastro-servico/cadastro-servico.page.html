<app-header>
  <span titulo>{{ modoEdicao ? 'Editar Serviço' : 'Cadastro dos Serviços' }}</span>
  <ion-button icon-botao [routerLink]="'/painel-servicos'" botao>
    <ion-icon name="close-outline" size="large"></ion-icon>
  </ion-button>
</app-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="salvarOuAtualizar()">
    <!-- Título -->
    <ion-item>
      <ion-input label="Nome do Serviço" type="text" formControlName="titulo"></ion-input>
    </ion-item>
    <div *ngIf="form.get('titulo')?.touched && form.get('titulo')?.invalid" class="erro-texto">
      <span *ngIf="form.get('titulo')?.errors?.['required']">Nome do serviço é obrigatório.</span>
      <span *ngIf="form.get('titulo')?.errors?.['minlength']">Nome deve ter pelo menos 3 caracteres.</span>
    </div>

    <!-- Preço -->
    <ion-item>
      <ion-input label="Preço" type="number" formControlName="preco"></ion-input>
    </ion-item>
    <div *ngIf="form.get('preco')?.touched && form.get('preco')?.invalid" class="erro-texto">
      <span *ngIf="form.get('preco')?.errors?.['required']">Preço é obrigatório.</span>
      <span *ngIf="form.get('preco')?.errors?.['min']">Preço deve ser maior que zero.</span>
    </div>

    <!-- Duração -->
    <ion-item>
      <ion-input label="Duração Estimada" type="text" placeholder="Ex: 30 minutos" formControlName="duracao"></ion-input>
    </ion-item>
    <div *ngIf="form.get('duracao')?.touched && form.get('duracao')?.invalid" class="erro-texto">
      <span *ngIf="form.get('duracao')?.errors?.['required']">Duração é obrigatória.</span>
    </div>

    <!-- Imagem (opcional) -->
    <ion-item>
      <ion-input label="Imagem (URL ou caminho)" type="text" placeholder="Opcional" formControlName="imagem"></ion-input>
    </ion-item>

    <!-- Erro geral -->
    <div *ngIf="erroCadastro" class="erro-texto">
      {{ erroCadastro }}
    </div>

    <ion-button type="submit" expand="block" class="custom-button">
      {{ modoEdicao ? 'Salvar' : 'Cadastrar' }}
    </ion-button>
  </form>
</ion-content>
